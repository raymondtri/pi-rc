<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#09090b" />
    <title>pi-rc</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --panel: #18181b;
        --line: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #22c55e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      header, form, #bar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.75rem;
        background: var(--panel);
      }
      header { border-bottom: 1px solid var(--line); }
      form, #bar, #ac { border-top: 1px solid var(--line); }
      #ac {
        display: none;
        flex-direction: column;
        max-height: 40vh;
        overflow: auto;
        background: var(--panel);
        padding: 0.35rem 0.5rem;
        gap: 0.25rem;
      }
      #ac.open { display: flex; }
      #ac button {
        text-align: left;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      #ac small { color: var(--muted); font-weight: 400; }
      #bar {
        font-size: 0.75rem;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      select, button, textarea, input {
        font: inherit;
        color: inherit;
      }
      select, textarea, input {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.55rem 0.6rem;
      }
      select { flex: 1; min-width: 0; }
      button {
        background: var(--accent);
        color: #052e16;
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.75rem;
        font-weight: 650;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      main {
        flex: 1;
        overflow: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .msg {
        max-width: 92%;
        padding: 0.65rem 0.75rem;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user { align-self: flex-end; background: #1d4ed8; }
      .assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .tool, .meta {
        align-self: center;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .empty {
        margin: auto;
        color: var(--muted);
        text-align: center;
        padding: 1rem;
      }
      form textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 8rem;
      }
      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 99px;
        background: #52525b;
        flex: none;
      }
      .dot.on { background: var(--accent); }
      .dot.busy { background: #eab308; }
      #sheet {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.6);
        padding: 12vh 0.75rem 0;
        z-index: 5;
      }
      #sheet.open { display: block; }
      #sheet .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px 16px 0 0;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        padding: 1rem;
        margin: 0 auto;
        max-width: 40rem;
      }
      #sheet h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
      #sheet .opts {
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin: 0.75rem 0;
      }
      #sheet .opt {
        text-align: left;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <select id="sessions"></select>
      <button id="abort" class="ghost" type="button">stop</button>
      <button id="create" type="button">new</button>
    </header>
    <main id="log">
      <p class="empty">Scan worked. Open or create a Pi session on the desktop — this is chat, not the TUI.</p>
    </main>
    <div id="bar"></div>
    <div id="ac"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message Pi…  /model /thinking /name" enterkeyhint="send"></textarea>
      <button type="submit">send</button>
    </form>
    <div id="sheet">
      <div class="card">
        <h2 id="sheet-title">Pick</h2>
        <p id="sheet-msg" class="meta"></p>
        <input id="sheet-filter" placeholder="filter" />
        <div class="opts" id="sheet-opts"></div>
        <input id="sheet-ask" placeholder="" />
        <button id="sheet-ok" type="button">ok</button>
        <button id="sheet-cancel" class="ghost" type="button">cancel</button>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("t") || sessionStorage.getItem("pi-rc-token") || "";
      if (params.get("t")) {
        sessionStorage.setItem("pi-rc-token", token);
        history.replaceState(null, "", location.pathname);
      }

      const state = { sessions: [], current: null, pick: null };
      const $ = (id) => document.getElementById(id);
      const headers = { authorization: `Bearer ${token}`, "content-type": "application/json" };

      function renderSelect() {
        const sel = $("sessions");
        const current = state.current;
        sel.innerHTML = "";
        if (!state.sessions.length) {
          const opt = document.createElement("option");
          opt.textContent = "no sessions";
          sel.append(opt);
          renderBar();
          return;
        }
        for (const s of state.sessions) {
          const opt = document.createElement("option");
          opt.value = s.id;
          const flag = s.pending ? "starting" : s.online ? (s.streaming ? "busy" : "live") : "offline";
          opt.textContent = `${s.name || s.id} · ${flag}${s.managed ? "" : " · other"}`;
          sel.append(opt);
        }
        if (current && state.sessions.some((s) => s.id === current)) sel.value = current;
        else state.current = sel.value;
        const s = state.sessions.find((x) => x.id === state.current);
        $("dot").className = "dot" + (s?.streaming ? " busy" : s?.online ? " on" : "");
        renderBar();
      }

      function renderBar() {
        const s = state.sessions.find((x) => x.id === state.current);
        const f = s?.footer || {};
        const parts = [
          f.name || s?.name,
          f.cwd || s?.cwd,
          f.model,
          f.thinking && f.thinking !== "off" ? f.thinking : null,
          f.percent != null ? `${Math.round(f.percent)}%` : null,
          f.cost ? `$${Number(f.cost).toFixed(2)}` : null,
        ].filter(Boolean);
        $("bar").textContent = parts.join(" · ");
      }

      function renderLog() {
        const s = state.sessions.find((x) => x.id === state.current);
        const log = $("log");
        log.innerHTML = "";
        if (!s) {
          log.innerHTML =
            '<p class="empty">No live Pi yet. Tap new to boot a desktop terminal, or open Pi there with this extension loaded.</p>';
          return;
        }
        if (s.pending || !s.online) {
          log.innerHTML = `<p class="empty">${s.pending ? "Starting on the desktop…" : "Pi is offline."}<br/>${s.cwd || ""}</p>`;
          return;
        }
        if (!s.transcript?.length) {
          log.innerHTML = `<p class="empty">${s.cwd || ""}<br/>live. /model /thinking /name</p>`;
          return;
        }
        for (const msg of s.transcript) {
          const div = document.createElement("div");
          div.className = "msg " + (msg.role || "meta");
          div.textContent = msg.text;
          log.append(div);
        }
        log.scrollTop = log.scrollHeight;
      }

      function pickCurrent(list) {
        const stored = sessionStorage.getItem("pi-rc-session");
        const wanted = state.current || stored;
        const cur = list.find((s) => s.id === wanted);
        if (cur && !cur.pending) return cur.id;
        if (cur?.pending) {
          const live = list.find(
            (s) => !s.pending && (s.managed || s.name === cur.name || s.cwd === cur.cwd),
          );
          if (live) return live.id;
        }
        const managed = list.find((s) => s.online && s.managed && !s.pending);
        const live = list.find((s) => s.online && !s.pending) || list.find((s) => !s.pending);
        return (managed || live || cur || list[0])?.id || null;
      }

      function applySessions(list) {
        state.sessions = list || [];
        state.current = pickCurrent(state.sessions);
        if (state.current) sessionStorage.setItem("pi-rc-session", state.current);
        const s = state.sessions.find((x) => x.id === state.current);
        if (s?.ui) openSheet(s.ui);
        renderSelect();
        renderLog();
      }

      function openSheet(pick) {
        state.pick = pick;
        $("sheet").classList.add("open");
        $("sheet-title").textContent = pick.title || "Pick";
        $("sheet-msg").textContent = pick.message || "";
        $("sheet-filter").value = "";
        $("sheet-ask").value = "";
        const isAsk = pick.kind === "ask";
        $("sheet-filter").style.display = isAsk ? "none" : "block";
        $("sheet-opts").style.display = isAsk ? "none" : "flex";
        $("sheet-ask").style.display = isAsk ? "block" : "none";
        $("sheet-ok").style.display = isAsk ? "block" : "none";
        renderSheetOpts();
        if (isAsk) $("sheet-ask").focus();
        else $("sheet-filter").focus();
      }

      function closeSheet() {
        state.pick = null;
        $("sheet").classList.remove("open");
      }

      function renderSheetOpts() {
        const pick = state.pick;
        if (!pick || pick.kind === "ask") return;
        const q = $("sheet-filter").value.trim().toLowerCase();
        const box = $("sheet-opts");
        box.innerHTML = "";
        for (const opt of pick.options || []) {
          const label = opt.label || opt.id;
          if (q && !label.toLowerCase().includes(q) && !String(opt.id).toLowerCase().includes(q)) continue;
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.type = "button";
          btn.textContent = label;
          btn.onclick = () => answerUi(opt.id);
          box.append(btn);
        }
      }

      async function answerUi(value, cancel = false) {
        const pick = state.pick;
        if (!pick || !state.current) return;
        closeSheet();
        await api(`/api/sessions/${encodeURIComponent(state.current)}/ui`, {
          method: "POST",
          body: JSON.stringify({ pickId: pick.id, value, cancel }),
        });
      }

      function onEvent(ev) {
        if (ev.type === "sessions") {
          applySessions(ev.sessions);
          return;
        }
        if (ev.type === "ui") {
          if (ev.sessionId === state.current || !state.current) openSheet(ev.pick);
          return;
        }
        const s = state.sessions.find((x) => x.id === ev.sessionId);
        if (!s) return;
        if (ev.type === "footer") {
          s.footer = ev.footer;
          if (ev.name) s.name = ev.name;
          if (ev.commands) s.commands = ev.commands;
          renderSelect();
          renderAc();
          return;
        }
        if (ev.type === "user") s.transcript.push({ role: "user", text: ev.text });
        if (ev.type === "echo") s.transcript.push({ role: "meta", text: ev.text });
        if (ev.type === "delta") {
          const last = s.transcript[s.transcript.length - 1];
          if (last?.role === "assistant" && last.live) last.text += ev.text;
          else s.transcript.push({ role: "assistant", text: ev.text, live: true });
          s.streaming = true;
          s.online = true;
        }
        if (ev.type === "tool") s.transcript.push({ role: "tool", text: `${ev.phase} ${ev.name}` });
        if (ev.type === "status") {
          s.streaming = ev.streaming;
          s.online = ev.online;
          if (ev.model) s.model = ev.model;
        }
        if (ev.type === "turn_end") {
          s.streaming = false;
          const last = s.transcript[s.transcript.length - 1];
          if (last) last.live = false;
        }
        renderSelect();
        if (ev.sessionId === state.current) renderLog();
      }

      async function api(path, opts = {}) {
        const res = await fetch(path, { headers, ...opts });
        if (res.status === 401) throw new Error("bad token — rescan the QR");
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || res.statusText);
        return body;
      }

      $("sessions").onchange = () => {
        state.current = $("sessions").value;
        if (state.current) sessionStorage.setItem("pi-rc-session", state.current);
        renderLog();
        renderBar();
      };
      $("sheet-filter").oninput = renderSheetOpts;
      $("sheet-cancel").onclick = () => answerUi(undefined, true);
      $("sheet-ok").onclick = () => answerUi($("sheet-ask").value);
      $("sheet-ask").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          answerUi($("sheet-ask").value);
        }
      });

      $("form").onsubmit = async (e) => {
        e.preventDefault();
        const text = $("input").value.trim();
        if (!text || !state.current) return;
        $("input").value = "";
        $("ac").classList.remove("open");
        try {
          await api(`/api/sessions/${encodeURIComponent(state.current)}/prompt`, {
            method: "POST",
            body: JSON.stringify({ text }),
          });
        } catch (err) {
          alert(err.message);
        }
      };

      const PICKER_CMDS = new Set(["model", "thinking", "name", "compact", "help"]);

      function renderAc() {
        const box = $("ac");
        const raw = $("input").value;
        if (!raw.startsWith("/") || raw.includes(" ")) {
          box.classList.remove("open");
          box.innerHTML = "";
          return;
        }
        const q = raw.slice(1).toLowerCase();
        const s = state.sessions.find((x) => x.id === state.current);
        const cmds = s?.commands || [];
        const hits = cmds.filter(
          (c) => !q || c.name.toLowerCase().startsWith(q) || c.name.toLowerCase().includes(q),
        ).slice(0, 30);
        box.innerHTML = "";
        if (!hits.length) {
          box.classList.remove("open");
          return;
        }
        for (const c of hits) {
          const btn = document.createElement("button");
          btn.type = "button";
          const strong = document.createElement("strong");
          strong.textContent = "/" + c.name + " ";
          const small = document.createElement("small");
          small.textContent = c.description || "";
          btn.append(strong, small);
          btn.onclick = () => {
            $("input").value = "/" + c.name;
            box.classList.remove("open");
            if (PICKER_CMDS.has(c.name)) $("form").requestSubmit();
            else {
              $("input").value = "/" + c.name + " ";
              $("input").focus();
            }
          };
          box.append(btn);
        }
        box.classList.add("open");
      }

      $("input").addEventListener("input", renderAc);
      $("input").addEventListener("focus", renderAc);
      $("input").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          $("form").requestSubmit();
        }
      });

      $("abort").onclick = async () => {
        if (!state.current) return;
        try {
          await api(`/api/sessions/${encodeURIComponent(state.current)}/abort`, { method: "POST" });
        } catch (err) {
          alert(err.message);
        }
      };

      $("create").onclick = async () => {
        const name = prompt("Session name?", `pi-${Math.random().toString(36).slice(2, 6)}`);
        if (name === null) return;
        const created = await api("/api/sessions", {
          method: "POST",
          body: JSON.stringify({ name }),
        });
        state.current = created.session.id;
      };

      if (!token) {
        $("log").innerHTML = '<p class="empty">Missing token. Rescan the QR from the desktop.</p>';
      } else {
        api("/api/sessions").then((d) => applySessions(d.sessions)).catch((err) => {
          $("log").innerHTML = `<p class="empty">${err.message}</p>`;
        });
        const es = new EventSource(`/api/stream?t=${encodeURIComponent(token)}`);
        es.onmessage = (m) => {
          try {
            onEvent(JSON.parse(m.data));
          } catch {}
        };
      }
    </script>
  </body>
</html>
